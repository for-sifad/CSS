<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Css</title>
    <!-- example of embedded css -->
    <style>
        p {
            color: brown;
        }

        h4 {
            font-size: 25px;
        }

        li {
            color: blue;
        }
    </style>
</head>
<body>
    <!-- exampe of inline css -->
    <h2 style="background-color: brown; color: white;">My First Css Website</h2>

    <div>
        <h4>Hello, welcome!</h4>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat, consequatur.</p>
    </div>

    <ul>
        <li>inline css</li>
        <li>internal or embedded css</li>
        <li>external css</li>
    </ul>
</body>
</html>
