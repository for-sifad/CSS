<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Css</title>
    <!-- example of embedded css -->
    <style>
        p {
            color: brown;
            width: 20%;
            background-color: lightgray;
        }

        h4 {
            font-size: 25px;
        }

        .common {
            color: green;
        }

        #unique {
            color: red;
        }
        
    </style>
</head>
<body>
    <!-- example of inline css -->
    <h2 style="background-color: brown; color: white;">My First Css Website</h2>

    <div>
        <h4>Hello, welcome!</h4>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat, consequatur.</p>
    </div>

    <ul>
        <li class="common">inline css</li>
        <li class="common">internal or embedded css</li>
        <li class="common">external css</li>
        <li id="unique">css frameworks</li>
    </ul>
</body>
</html>
